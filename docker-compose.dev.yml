# docker-compose.dev.yml
# Local dev stack (self-contained):
# - bind mounts
# - dev-only test deps (pytest)
# - postgres image for local dev


name: llm-chat-platform-dev

services:
  api:
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    build:
      context: .
      args:
        INSTALL_DEV_DEPS: "1"
    volumes:
      - ./app:/app/app
      - ./reports:/app/app/reports
      - ./tests:/app/tests
      - ./pytest.ini:/app/pytest.ini:ro
    ports:
      - "8001:8000"
    
    environment:
      APP_ENV: dev
      PYTHONPATH: /app
      DATABASE_URL: ${DATABASE_URL}
      PYTEST_ADDOPTS: "-o cache_dir=/tmp/pytest_cache"
      PROVIDER: ${PROVIDER:-stub}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      PROVIDER_TIMEOUT_S: ${PROVIDER_TIMEOUT_S:-12.0}


    depends_on:
      - postgres

  postgres:
    image: postgres:16
    ports:
      - "15432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
