# docker-compose.dev.yml
# Local dev stack (self-contained):
# - bind mounts
# - dev-only test deps (pytest)
# - postgres image for local dev


name: llm-chat-platform-dev

services:
  api:
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    build:
      context: .
      args:
        INSTALL_DEV_DEPS: "1"
    volumes:
      - ./app:/app/app
      - ./reports:/app/app/reports
      - ./tests:/app/tests
      - ./experiments:/app/experiments
      - ./pytest.ini:/app/pytest.ini:ro
      - ${GOOGLE_ADC_HOST_PATH:-./secrets/gcp-adc.json}:/run/secrets/gcp-adc.json:ro
    ports:
      - "8001:8000"
    
    environment:
      APP_ENV: dev
      PYTHONPATH: /app
      DATABASE_URL: ${DATABASE_URL}
      DATABASE_URL_APP: ${DATABASE_URL_APP:-}
      RAG_ENABLED: ${RAG_ENABLED:-false}
      PYTEST_ADDOPTS: "-o cache_dir=/tmp/pytest_cache"
      PROVIDER: ${PROVIDER:-stub}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      PROVIDER_TIMEOUT_S: ${PROVIDER_TIMEOUT_S:-12.0}

      BEDROCK_REGION: ${BEDROCK_REGION:-}
      BEDROCK_MODEL: ${BEDROCK_MODEL:-}
      BEDROCK_PROMPT_VERSION: ${BEDROCK_PROMPT_VERSION:-v1}
      BEDROCK_MAX_ATTEMPTS: ${BEDROCK_MAX_ATTEMPTS:-3}
      BEDROCK_BACKOFF_BASE_MS: ${BEDROCK_BACKOFF_BASE_MS:-100}
      BEDROCK_BACKOFF_MAX_MS: ${BEDROCK_BACKOFF_MAX_MS:-1000}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}

      # ORQ-22 isolated benchmark configuration. ADC stays on the host and is
      # mounted read-only; no Google SDK or credential file enters the image.
      AWS_RERANK_REGION: ${AWS_RERANK_REGION:-ca-central-1}
      AWS_RERANK_MODEL: ${AWS_RERANK_MODEL:-amazon.rerank-v1:0}
      GCP_PROJECT_ID: ${GCP_PROJECT_ID:-}
      GCP_RERANK_LOCATION: ${GCP_RERANK_LOCATION:-global}
      GCP_RERANK_MODEL: ${GCP_RERANK_MODEL:-semantic-ranker-default-004}
      GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/gcp-adc.json

    depends_on:
      - postgres

  postgres:
    image: pgvector/pgvector:pg16
    ports:
      - "15432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/postgres-init:/docker-entrypoint-initdb.d:ro

volumes:
  postgres_data:
