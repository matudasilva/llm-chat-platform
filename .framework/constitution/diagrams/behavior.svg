<svg width="900" height="660" viewBox="0 0 900 660" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Phase behaviour and dependencies — llm-chat-platform roadmap</title>
<desc>Roadmap dependencies after ORQ-21, ORQ-22, ORQ-23 and ORQ-24. The RAG baseline, isolated reranking benchmark, retrieval pipeline (rewrite/retrieve/rerank/evaluate) and reranker availability cascade (GCP primary, AWS fallback) are complete; generation (ORQ-25) and evaluation harness (ORQ-26) remain future work. Phase 1 leftovers continue in parallel, while Phase 3 depends on routing and per-tenant accounting.</desc>
