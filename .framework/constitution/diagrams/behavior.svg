<svg width="900" height="600" viewBox="0 0 900 600" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Phase behaviour and dependencies — llm-chat-platform roadmap</title>
<desc>Roadmap phases and the dependencies between them. Phase 0 is closed; Phase 1 is substantially delivered but retains open items that do not block Phase 2; Phase 2 (retrieval and routing) is the active front and settles the deferred RLS decision; Phase 3 (AI Green) extends existing components and depends on per-tenant accounting. Completed by hand during fw-init from roadmap.md.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="arrowdim" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#8A8880" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="900" height="600" fill="#FBFAF7"/>
<text x="450" y="38" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="600" fill="#26215C">Phase behaviour and dependencies</text>
<text x="450" y="58" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#5F5E5A">Ordering is subject to revision. Deviating is not drift as long as the change lands as an ADR.</text>

<!-- Phase 0 -->
<g><rect x="40" y="86" width="170" height="120" rx="12" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.8"/>
<text x="125" y="112" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="600" fill="#2C2C2A">Phase 0</text>
<text x="125" y="132" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#5F5E5A">V1.1 clean closure</text>
<text x="125" y="156" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#5F5E5A">ADR mechanism live</text>
<text x="125" y="172" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#5F5E5A">CI reconciliation</text>
<text x="125" y="194" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="600" fill="#3B6D11">closed</text></g>

<line x1="210" y1="146" x2="256" y2="146" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="233" y="136" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#5F5E5A">enables</text>

<!-- Phase 1 -->
<g><rect x="256" y="86" width="230" height="120" rx="12" fill="#EAF3DE" stroke="#3B6D11" stroke-width="0.8"/>
<text x="371" y="112" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="600" fill="#173404">Phase 1 — V2 core</text>
<text x="371" y="132" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#27500A">capabilities-first (ADR-001)</text>
<text x="371" y="148" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#27500A">multitenancy foundation (ADR-003)</text>
<text x="371" y="164" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#27500A">frontend · dev→prod (ADR-005)</text>
<text x="371" y="194" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="600" fill="#3B6D11">substantially delivered</text></g>

<!-- Phase 1 leftovers -->
<g><rect x="256" y="240" width="230" height="106" rx="12" fill="#FAECE7" stroke="#993C1D" stroke-width="0.8" stroke-dasharray="4 3"/>
<text x="371" y="264" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="600" fill="#4A1B0C">Open in Phase 1</text>
<text x="371" y="284" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#712B13">Execution Orchestrator + Tool Calling</text>
<text x="371" y="300" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#712B13">default provider off stub</text>
<text x="371" y="316" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#712B13">identity-based message sequencing</text>
<text x="371" y="336" text-anchor="middle" font-family="sans-serif" font-size="9.5" fill="#8A5A3E">runs in parallel — does not block Phase 2</text></g>
<line x1="371" y1="206" x2="371" y2="240" stroke="#8A8880" stroke-width="1.5" marker-end="url(#arrowdim)"/>

<line x1="486" y1="146" x2="532" y2="146" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="509" y="136" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#5F5E5A">enables</text>

<!-- Phase 2 -->
<g><rect x="532" y="86" width="328" height="260" rx="12" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/>
<text x="696" y="112" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="600" fill="#04342C">Phase 2 — Retrieval + Routing</text>
<text x="696" y="130" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#085041">a separate read capability; /chat invariant untouched</text>
<text x="696" y="332" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="600" fill="#0F6E56">active front</text></g>
<g><rect x="552" y="144" width="288" height="46" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="696" y="164" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="500" fill="#2C2C2A">1 · RAG baseline</text>
<text x="696" y="180" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#5F5E5A">pgvector behind VectorStorePort · tenant-scoped · settles RLS (ADR-004)</text></g>
<line x1="696" y1="190" x2="696" y2="212" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<g><rect x="552" y="212" width="288" height="42" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="696" y="232" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="500" fill="#2C2C2A">2 · Routing evidence dataset</text>
<text x="696" y="247" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#5F5E5A">heuristic + static RoutingPolicy by default</text></g>
<line x1="696" y1="254" x2="696" y2="276" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<g><rect x="552" y="276" width="288" height="42" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5" stroke-dasharray="4 3"/>
<text x="696" y="296" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="500" fill="#2C2C2A">3 · Offline ML routing baseline</text>
<text x="696" y="311" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#5F5E5A">conditional — only if step 2 shows real signal</text></g>

<!-- Phase 3 -->
<g><rect x="256" y="404" width="604" height="130" rx="12" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/>
<text x="558" y="430" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="600" fill="#26215C">Phase 3 — AI Green extension</text>
<text x="558" y="450" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#3C3489">An extension, not a rewrite: every piece maps onto a component that already exists.</text>
<text x="380" y="480" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#3C3489">energy / CO2e telemetry</text>
<text x="380" y="496" text-anchor="middle" font-family="sans-serif" font-size="9.5" fill="#5F5E5A">extends UsageEvent</text>
<text x="558" y="480" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#3C3489">carbon-aware routing</text>
<text x="558" y="496" text-anchor="middle" font-family="sans-serif" font-size="9.5" fill="#5F5E5A">extends RoutingPolicy</text>
<text x="736" y="480" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#3C3489">semantic caching</text>
<text x="736" y="496" text-anchor="middle" font-family="sans-serif" font-size="9.5" fill="#5F5E5A">extends the Redis layer</text>
<text x="558" y="522" text-anchor="middle" font-family="sans-serif" font-size="9.5" fill="#5F5E5A">Horizon: carbon-aware scheduler with batch / deferred modes</text></g>

<line x1="696" y1="346" x2="696" y2="404" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="770" y="378" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#5F5E5A">RoutingPolicy must exist first</text>
<line x1="371" y1="346" x2="371" y2="404" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="300" y="378" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#5F5E5A">per-tenant accounting</text>

<text x="450" y="576" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#8A8880">Completed by hand during fw-init from roadmap.md — live state is authoritative in the Notion Master Project Document.</text>
