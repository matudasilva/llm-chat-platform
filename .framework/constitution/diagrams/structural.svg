<svg width="900" height="620" viewBox="0 0 900 620" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Product structure — llm-chat-platform</title>
<desc>Module view of the backend by layer: HTTP edge (middleware + routes), domain services, the ProviderPort abstraction with its adapters, and infrastructure. Completed by hand during fw-init from mission.md Scope and the real app/ tree.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="900" height="620" fill="#FBFAF7"/>
<text x="450" y="38" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="600" fill="#26215C">Product structure — llm-chat-platform</text>
<text x="450" y="58" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#5F5E5A">Layers are one-directional: no provider-specific logic crosses upward into routes or domain services</text>

<!-- HTTP edge -->
<g><rect x="40" y="80" width="820" height="110" rx="14" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/>
<text x="60" y="104" font-family="sans-serif" font-size="14" font-weight="600" fill="#26215C">HTTP edge — app/http/, app/api/routes/</text></g>
<g><rect x="60" y="116" width="230" height="58" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="175" y="138" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="500" fill="#2C2C2A">Middleware (LIFO order)</text>
<text x="175" y="156" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#5F5E5A">CORS outermost · Tenant innermost (pure ASGI)</text></g>
<g><rect x="306" y="116" width="160" height="58" rx="8" fill="#EAF3DE" stroke="#3B6D11" stroke-width="0.8"/>
<text x="386" y="138" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="600" fill="#173404">/chat</text>
<text x="386" y="156" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#27500A">sole write-path · SSE</text></g>
<g><rect x="482" y="116" width="180" height="58" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="572" y="138" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="500" fill="#2C2C2A">Read routes</text>
<text x="572" y="156" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#5F5E5A">conversations · usage_events</text></g>
<g><rect x="678" y="116" width="162" height="58" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.8"/>
<text x="759" y="138" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="500" fill="#4A1B0C">External capabilities</text>
<text x="759" y="156" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#712B13">web_read · notion_read/write</text></g>

<line x1="386" y1="190" x2="386" y2="228" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="572" y1="190" x2="572" y2="228" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="759" y1="190" x2="759" y2="228" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

<!-- Domain services -->
<g><rect x="40" y="228" width="820" height="112" rx="14" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/>
<text x="60" y="252" font-family="sans-serif" font-size="14" font-weight="600" fill="#04342C">Domain services — app/services/, app/core/domain/</text>
<text x="60" y="270" font-family="sans-serif" font-size="10" fill="#085041">Provider-agnostic. Tenant scoping is enforced here, server-side.</text></g>
<g><rect x="306" y="278" width="160" height="50" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="386" y="300" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="500" fill="#2C2C2A">ChatService</text>
<text x="386" y="317" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#5F5E5A">4-step atomic write</text></g>
<g><rect x="60" y="278" width="230" height="50" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="175" y="300" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="500" fill="#2C2C2A">chat_response_cache · routing_signals</text>
<text x="175" y="317" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#5F5E5A">best-effort · tenant-namespaced keys</text></g>
<g><rect x="482" y="278" width="180" height="50" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="572" y="300" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="500" fill="#2C2C2A">conversation_query_service</text>
<text x="572" y="317" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#5F5E5A">usage_events · readiness · trace</text></g>
<g><rect x="678" y="278" width="162" height="50" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="759" y="300" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="500" fill="#2C2C2A">web_read · notion_*</text>
<text x="759" y="317" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#5F5E5A">read/write safety contracts</text></g>

<line x1="386" y1="340" x2="386" y2="378" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="616" y1="340" x2="616" y2="470" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

<!-- Provider port -->
<g><rect x="40" y="378" width="500" height="118" rx="14" fill="#FAECE7" stroke="#993C1D" stroke-width="0.8"/>
<text x="60" y="402" font-family="sans-serif" font-size="14" font-weight="600" fill="#4A1B0C">ProviderPort — app/core/providers/</text>
<text x="60" y="420" font-family="sans-serif" font-size="10" fill="#712B13">Stable async contract (generate / stream). New context travels in ProviderInput.metadata.</text></g>
<g><rect x="60" y="432" width="140" height="50" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="130" y="454" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="500" fill="#2C2C2A">ResilientProvider</text>
<text x="130" y="471" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#5F5E5A">single-hop fallback</text></g>
<g><rect x="212" y="432" width="100" height="50" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="262" y="461" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#2C2C2A">OpenAI</text></g>
<g><rect x="324" y="432" width="100" height="50" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="374" y="461" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#2C2C2A">Bedrock</text></g>
<g><rect x="436" y="432" width="88" height="50" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="480" y="461" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#2C2C2A">Stub</text></g>

<!-- Infra -->
<g><rect x="560" y="470" width="300" height="26" rx="6" fill="none" stroke="none"/></g>
<g><rect x="40" y="514" width="820" height="80" rx="14" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.8"/>
<text x="60" y="538" font-family="sans-serif" font-size="14" font-weight="600" fill="#2C2C2A">Infrastructure — app/infra/, app/models/, app/alembic/</text>
<text x="60" y="558" font-family="sans-serif" font-size="11" fill="#5F5E5A">SQLAlchemy async engine (PostgreSQL) · Redis client · Conversation / Message / UsageEvent · explicit Alembic chain</text>
<text x="60" y="576" font-family="sans-serif" font-size="10" fill="#5F5E5A">Migrations never run at startup. Cache and telemetry failures never break the write-path.</text></g>

<line x1="130" y1="496" x2="130" y2="514" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="616" y1="496" x2="616" y2="514" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

<text x="450" y="612" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#8A8880">Completed by hand during fw-init from mission.md Scope and the real app/ tree — see docs/lld_* for the authoritative detail.</text>
</svg>
