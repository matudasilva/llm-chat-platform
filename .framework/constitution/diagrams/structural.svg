<svg width="900" height="680" viewBox="0 0 900 680" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Product structure — llm-chat-platform</title>
<desc>Current backend module boundaries after ORQ-25: HTTP edge, provider-agnostic domain and services, stable ports, concrete adapters, and persistence. The retrieval pipeline (rewrite/retrieve/rerank/evaluate) remains available through its read endpoint and, behind an independent default-off flag, provides context to /chat through ProviderInput metadata before generation. /chat remains the sole business write-path and emits structured sources; answer feedback updates UsageEvent without adding provider logic to routes or domain services. The production reranker is a GCP-primary/AWS-fallback availability cascade; Qwen remains benchmark-only.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
