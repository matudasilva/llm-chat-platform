<svg width="900" height="600" viewBox="0 0 900 600" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Deployment — llm-chat-platform (Option A: image promotion)</title>
<desc>Deployment topology, drawn generically: three source repositories feed a CI pipeline that publishes a versioned container image to a registry; a thin deploy repository pins the tag; the API runs on a managed PaaS against serverless Postgres and Redis, with the SPA served from a static host. No hostnames, endpoints or project identifiers are recorded here — this file is versioned in a public repository. Completed by hand during fw-init.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="900" height="600" fill="#FBFAF7"/>
<text x="450" y="38" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="600" fill="#26215C">Deployment — Option A: promotion by container image</text>
<text x="450" y="58" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#5F5E5A">Promoting means bumping a tag. Rolling back means re-pinning the previous one. Migrations are an explicit release step, never auto-run.</text>

<!-- Source -->
<g><rect x="40" y="82" width="820" height="98" rx="14" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/>
<text x="60" y="106" font-family="sans-serif" font-size="14" font-weight="600" fill="#26215C">Source repositories</text></g>
<g><rect x="60" y="118" width="250" height="50" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="185" y="140" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="500" fill="#2C2C2A">llm-chat-platform</text>
<text x="185" y="157" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#5F5E5A">backend — the only code repo</text></g>
<g><rect x="326" y="118" width="250" height="50" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="451" y="140" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="500" fill="#2C2C2A">llm-chat-platform-web</text>
<text x="451" y="157" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#5F5E5A">React + Vite SPA — own release cycle</text></g>
<g><rect x="592" y="118" width="248" height="50" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="716" y="140" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="500" fill="#2C2C2A">llm-chat-platform-deploy</text>
<text x="716" y="157" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#5F5E5A">artifacts + pinned image tag only</text></g>

<line x1="185" y1="180" x2="185" y2="222" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="451" y1="180" x2="451" y2="392" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="716" y1="180" x2="716" y2="222" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

<!-- Build -->
<g><rect x="40" y="222" width="820" height="112" rx="14" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/>
<text x="60" y="246" font-family="sans-serif" font-size="14" font-weight="600" fill="#04342C">Build and release</text></g>
<g><rect x="60" y="258" width="250" height="60" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="185" y="280" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="500" fill="#2C2C2A">CI — build, guardrails, publish</text>
<text x="185" y="298" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#5F5E5A">reconciliation + drift checks</text>
<text x="185" y="312" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#5F5E5A">no automated deploy step</text></g>
<g><rect x="326" y="258" width="250" height="60" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="451" y="280" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="500" fill="#2C2C2A">Container registry</text>
<text x="451" y="298" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#5F5E5A">versioned image :sha / :v*</text>
<text x="451" y="312" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#5F5E5A">proxied through a remote repo to the PaaS</text></g>
<g><rect x="592" y="258" width="248" height="60" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.8"/>
<text x="716" y="280" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="500" fill="#4A1B0C">Environments</text>
<text x="716" y="298" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#712B13">staging tracks :main / :sha</text>
<text x="716" y="312" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#712B13">prod advances only on v* tags</text></g>

<line x1="310" y1="288" x2="326" y2="288" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="576" y1="288" x2="592" y2="288" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="185" y1="334" x2="185" y2="392" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

<!-- Runtime -->
<g><rect x="40" y="392" width="820" height="140" rx="14" fill="#EAF3DE" stroke="#3B6D11" stroke-width="0.8"/>
<text x="60" y="416" font-family="sans-serif" font-size="14" font-weight="600" fill="#173404">Runtime (staging today; same shape for prod)</text>
<text x="60" y="434" font-family="sans-serif" font-size="10" fill="#27500A">Portability is deliberate: the same image plus standard DATABASE_URL / REDIS_URL env vars runs on any PaaS or VPS.</text></g>
<g><rect x="60" y="448" width="250" height="66" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="185" y="470" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="500" fill="#2C2C2A">API on managed PaaS</text>
<text x="185" y="488" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#5F5E5A">scale-to-zero container runtime</text>
<text x="185" y="504" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#5F5E5A">secrets from a managed secret store</text></g>
<g><rect x="326" y="448" width="250" height="66" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="451" y="470" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="500" fill="#2C2C2A">SPA on a static host</text>
<text x="451" y="488" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#5F5E5A">API base URL parameterised at build</text>
<text x="451" y="504" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#5F5E5A">reaches the API over CORS + SSE</text></g>
<g><rect x="592" y="448" width="248" height="66" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="716" y="470" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="500" fill="#2C2C2A">Managed data services</text>
<text x="716" y="488" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#5F5E5A">serverless PostgreSQL (autosuspends)</text>
<text x="716" y="504" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#5F5E5A">serverless Redis over TLS</text></g>

<line x1="310" y1="481" x2="326" y2="481" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
<line x1="576" y1="481" x2="592" y2="481" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

<text x="450" y="562" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#2C2C2A">Release step, run explicitly against the target database: alembic -c app/alembic.ini upgrade head</text>
<text x="450" y="586" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#8A8880">Completed by hand during fw-init. Deliberately generic — no hostnames, endpoints or project identifiers, since this file is public.</text>
</svg>
