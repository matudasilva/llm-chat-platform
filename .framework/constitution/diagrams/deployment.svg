<svg width="900" height="660" viewBox="0 0 900 660" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Deployment — llm-chat-platform</title>
<desc>Current build and runtime topology, including the pgvector corpus, separate owner and unprivileged RAG database connections, external embedding service, and the ORQ-22 benchmark environment. Benchmark rerankers are not part of the deployed request path.</desc>
