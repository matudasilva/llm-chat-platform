<svg width="1000" height="700" viewBox="0 0 1000 700" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Entity relationship — llm-chat-platform PostgreSQL</title>
<desc>Current product-owned PostgreSQL schema after ORQ-25. Conversation, Message and UsageEvent serve the atomic /chat path; UsageEvent records nullable up/down feedback for the tenant-owned assistant message. Document and Chunk form the separately ingested RAG corpus. Documents and chunks are tenant-scoped with PostgreSQL RLS through an unprivileged application role.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="1000" height="700" fill="#FBFAF7"/>
<text x="500" y="36" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="600" fill="#26215C">Entity relationship — llm-chat-platform PostgreSQL</text>
<text x="500" y="57" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#5F5E5A">Chat writes are atomic through /chat; corpus writes use the explicit ingestion workflow</text>

<text x="45" y="92" font-family="sans-serif" font-size="14" font-weight="600" fill="#26215C">Chat and usage schema</text>
