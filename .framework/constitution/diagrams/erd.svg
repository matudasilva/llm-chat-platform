<text x="78" y="152" font-family="sans-serif" font-size="11" font-weight="600" fill="#26215C">PK  id</text>
<text x="78" y="174" font-family="sans-serif" font-size="11" font-weight="600" fill="#3C3489">      tenant_id</text>
<text x="78" y="196" font-family="sans-serif" font-size="11" fill="#3C3489">      created_at</text>
<text x="78" y="218" font-family="sans-serif" font-size="11" fill="#3C3489">      updated_at</text>
<text x="78" y="246" font-family="sans-serif" font-size="9.5" fill="#5F5E5A">scoped in the service layer (ADR-004)</text></g>

<g><rect x="520" y="96" width="240" height="190" rx="10" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/>
<rect x="520" y="96" width="240" height="34" rx="10" fill="#0F6E56"/>
<text x="640" y="119" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="600" fill="#FBFAF7">Message</text>
<text x="538" y="152" font-family="sans-serif" font-size="11" font-weight="600" fill="#04342C">PK  id</text>
<text x="538" y="174" font-family="sans-serif" font-size="11" font-weight="600" fill="#085041">FK  conversation_id</text>
<text x="538" y="196" font-family="sans-serif" font-size="11" font-weight="600" fill="#085041">      tenant_id</text>
<text x="538" y="218" font-family="sans-serif" font-size="11" fill="#085041">      role  (user | assistant)</text>
<text x="538" y="240" font-family="sans-serif" font-size="11" fill="#085041">      content</text>
<text x="538" y="262" font-family="sans-serif" font-size="11" fill="#085041">      created_at</text></g>

<g><rect x="290" y="342" width="300" height="170" rx="10" fill="#FAECE7" stroke="#993C1D" stroke-width="0.8"/>
