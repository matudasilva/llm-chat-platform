<svg width="900" height="560" viewBox="0 0 900 560" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Entity relationship — llm-chat-platform (PostgreSQL)</title>
<desc>Product schema owned by the Alembic migration chain: Conversation, Message and UsageEvent. Tenant scoping is carried by tenant_id on Conversation and Message; UsageEvent.tenant_id is documented debt, deferred pending cost-pipeline analysis. Completed by hand during fw-init.</desc>
<defs><marker id="crow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="900" height="560" fill="#FBFAF7"/>
<text x="450" y="38" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="600" fill="#26215C">Entity relationship — llm-chat-platform (PostgreSQL)</text>
<text x="450" y="58" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#5F5E5A">Written only through /chat, in a single transaction per request. Schema evolves only through the explicit Alembic chain.</text>

<g><rect x="60" y="96" width="240" height="168" rx="10" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/>
<rect x="60" y="96" width="240" height="34" rx="10" fill="#534AB7"/>
