<text x="308" y="486" font-family="sans-serif" font-size="11" fill="#712B13">      cost · created_at</text>
<text x="308" y="504" font-family="sans-serif" font-size="9.5" fill="#8A5A3E">tenant_id: known debt, deferred</text></g>

