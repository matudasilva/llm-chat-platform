services:
  api:
    build: .
    container_name: llm-chat-api
    env_file:
      - .env
    ports:
      - "8001:8000"
    depends_on:
      postgres:
        condition: service_started
      redis:
        condition: service_started
    networks:
      - llmnet
    volumes:
      - ../notion-mcp-test:/notion-mcp-server
    # NO construir DATABASE_URL acá. Que venga en .env
    environment:
        - STUB_PROVIDER_MODE=${STUB_PROVIDER_MODE:-ok}

    #   DATABASE_URL: ${DATABASE_URL}

  postgres:
    image: pgvector/pgvector:pg16
    container_name: llm-chat-postgres
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD}
      POSTGRES_EVALUATION_PASSWORD: ${POSTGRES_EVALUATION_PASSWORD:-}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - llmnet

  redis:
    image: redis:7-alpine
    container_name: llm-chat-redis
    healthcheck:
      test: ["CMD", "redis-cli", "PING"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - llmnet
    ports:
      - "6380:6379"

  # DEFERRED: notion-mcp-server docker container integration
  # MVP uses local subprocess via ControlledNotionReadClient(command="notion-mcp-read")
  # Docker service pattern requires network/transport changes (socket, HTTP wrapper)
  # Future work: https://github.com/matudasilva/notion-mcp-read/issues/xyz
  #
  # notion-mcp-server:
  #   build:
  #     context: ./external/notion-mcp-read
  #     dockerfile: Dockerfile
  #   container_name: llm-chat-notion-mcp
  #   environment:
  #     - NOTION_API_TOKEN=${NOTION_API_TOKEN}
  #     - NOTION_ROOT_PAGE_ID=${NOTION_ROOT_PAGE_ID}
  #     - NOTION_ALLOWED_PAGE_IDS=${NOTION_ALLOWED_PAGE_IDS}
  #     - NOTION_ENABLE_WRITE=${NOTION_ENABLE_WRITE:-false}
  #   networks:
  #     - llmnet

networks:
  llmnet:

volumes:
  postgres_data:
