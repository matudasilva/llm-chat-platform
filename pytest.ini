[pytest]
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
timeout = 60
cache_dir = /tmp/pytest_cache

testpaths =
    tests

markers =
    postgres: requires a real Postgres with pgvector reachable via DATABASE_URL/DATABASE_URL_APP;
        skipped automatically when RAG_TEST_DATABASE_URL is unset (see tests/conftest.py). Never
        skipped by timeout — the 60s suite timeout above still applies per test.
    gcp: requires live GCP Ranking API access; skipped unless RUN_GCP_RERANK_INTEGRATION is enabled.
    aws: requires live AWS Bedrock Rerank access; skipped unless RUN_AWS_RERANK_INTEGRATION is enabled.
    cuda: requires the optional Qwen dependencies, model weights, and CUDA; skipped unless
        RUN_QWEN_RERANK_INTEGRATION is enabled.
