<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>LLM Chat Platform — Minimal UI</title>
    <style>
      body { font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; margin: 24px; max-width: 900px; }
      h1 { margin: 0 0 8px 0; font-size: 20px; }
      .muted { color: #666; font-size: 13px; margin-bottom: 16px; }
      .row { display: flex; gap: 12px; }
      textarea { width: 100%; height: 90px; padding: 10px; font-size: 14px; }
      button { padding: 10px 14px; font-size: 14px; cursor: pointer; }
      button:disabled { opacity: 0.6; cursor: not-allowed; }
      .chat { margin-top: 18px; border: 1px solid #ddd; border-radius: 10px; padding: 12px; }
      .msg { padding: 10px; border-radius: 10px; margin: 8px 0; white-space: pre-wrap; }
      .user { background: #f3f3f3; }
      .assistant { background: #eef6ff; }
      .meta { font-size: 12px; color: #555; margin-top: 8px; }
      .error { color: #b00020; font-size: 13px; margin-top: 10px; }
      code { background: #f6f6f6; padding: 2px 4px; border-radius: 6px; }
    </style>
  </head>
  <body>
    <h1>LLM Chat Platform — Minimal Streaming UI</h1>
    <div class="muted">
      Sends <code>POST /chat</code> with <code>{"stream": true}</code> and renders SSE events (<code>token</code>, <code>done</code>, <code>error</code>).
    </div>

    <div class="row">
      <textarea id="input" placeholder="Type a message..."></textarea>
      <button id="send">Send</button>
    </div>

    <div id="err" class="error" style="display:none;"></div>

    <div class="chat" id="chat"></div>

    <div class="meta" id="meta"></div>

    <script>
      const inputEl = document.getElementById("input");
      const sendBtn = document.getElementById("send");
      const chatEl = document.getElementById("chat");
      const metaEl = document.getElementById("meta");
      const errEl = document.getElementById("err");

      function showError(msg) {
        errEl.textContent = msg;
        errEl.style.display = "block";
      }
      function clearError() {
        errEl.textContent = "";
        errEl.style.display = "none";
      }

      function addMessage(role, text) {
        const div = document.createElement("div");
        div.className = "msg " + role;
        div.textContent = text;
        chatEl.appendChild(div);
        chatEl.scrollTop = chatEl.scrollHeight;
        return div;
      }

      function updateMeta(donePayload) {
        metaEl.textContent =
          `request_id=${donePayload.request_id} conversation_id=${donePayload.conversation_id}`;
      }

      // Minimal SSE parser over fetch streaming response
      async function sendStreaming(message) {
        clearError();
        sendBtn.disabled = true;

        addMessage("user", message);
        const assistantDiv = addMessage("assistant", "");

        const resp = await fetch("/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message, stream: true }),
        });

        if (!resp.ok) {
          showError(`HTTP ${resp.status}`);
          sendBtn.disabled = false;
          return;
        }

        const ct = resp.headers.get("content-type") || "";
        if (!ct.startsWith("text/event-stream")) {
          // fallback: non-stream response
          const data = await resp.json();
          assistantDiv.textContent = data.assistant_content || "(no content)";
          sendBtn.disabled = false;
          return;
        }

        const reader = resp.body.getReader();
        const decoder = new TextDecoder("utf-8");
        let buffer = "";
        let currentEvent = null;

        while (true) {
          const { value, done } = await reader.read();
          if (done) break;

          buffer += decoder.decode(value, { stream: true });

          // Parse line by line
          let idx;
          while ((idx = buffer.indexOf("\n")) >= 0) {
            const line = buffer.slice(0, idx).replace(/\r$/, "");
            buffer = buffer.slice(idx + 1);

            if (!line) continue;

            if (line.startsWith("event: ")) {
              currentEvent = line.slice("event: ".length).trim();
              continue;
            }

            if (line.startsWith("data: ")) {
              const data = line.slice("data: ".length);

              if (currentEvent === "token") {
                assistantDiv.textContent += data;
              } else if (currentEvent === "done") {
                try {
                  const donePayload = JSON.parse(data);
                  updateMeta(donePayload);
                } catch (_) {}
                sendBtn.disabled = false;
                return;
              } else if (currentEvent === "error") {
                try {
                  const errPayload = JSON.parse(data);
                  showError(`stream error: ${errPayload.error_kind || "unknown"}`);
                } catch (_) {
                  showError("stream error");
                }
                sendBtn.disabled = false;
                return;
              }
            }
          }
        }

        sendBtn.disabled = false;
      }

      sendBtn.addEventListener("click", async () => {
        const msg = inputEl.value.trim();
        if (!msg) return;
        inputEl.value = "";
        await sendStreaming(msg);
      });

      inputEl.addEventListener("keydown", async (e) => {
        if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) {
          const msg = inputEl.value.trim();
          if (!msg) return;
          inputEl.value = "";
          await sendStreaming(msg);
        }
      });
    </script>
  </body>
</html>
