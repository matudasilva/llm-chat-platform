name: CI

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          # Full history AND all remote-tracking refs. The default shallow
          # clone has no `origin/main`, which breaks every check that measures
          # this branch against its branch point with main (the ORQ-37 settings
          # -default guard and the honesty sweep's default `--base`). Those
          # checks then fail on the runner for a reason that has nothing to do
          # with what they assert.
          fetch-depth: 0

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r app/requirements.txt -r app/requirements-dev.txt

      - name: Smoke-check script import paths
        run: |
          python -c "
          import ast, pathlib, sys
          bad = []
          for p in pathlib.Path('app/scripts').glob('*.py'):
              for node in ast.walk(ast.parse(p.read_text())):
                  if isinstance(node, ast.ImportFrom) and (node.module or '').startswith('core.'):
                      bad.append(f'{p}: bare core.* import (should be app.core.*): from {node.module}')
                  if isinstance(node, ast.Import):
                      for alias in node.names:
                          if alias.name.startswith('core.'):
                              bad.append(f'{p}: bare core.* import (should be app.core.*): import {alias.name}')
          if bad:
              print('\n'.join(bad)); sys.exit(1)
          print('OK - no bare core.* imports in app/scripts/')
          "

      - name: Run narrowed pytest baseline
        run: |
          python -m pytest -q \
            tests/core \
            tests/api/test_health_readyz.py \
            tests/api/test_request_ids.py \
            tests/api/test_request_size_limit.py \
            tests/api/test_structured_logging.py \
            tests/test_cost_report_pipeline.py

      - name: Validate Docker build
        run: docker build -t llm-chat-platform:ci .
