name: Guardrails

on:
  pull_request:
  push:

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Scan changed files
        shell: bash
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE_REF="${{ github.event.pull_request.base.sha }}"
          else
            BASE_REF="${{ github.event.before }}"
          fi

          HEAD_REF="${{ github.sha }}"

          # Base resolution lives in app/scripts/guardrails_base.py, not here.
          # Inline, it could not be tested, and two defects survived because of
          # it: a new branch (`before` all-zeros) fell back to the empty tree
          # and scanned the whole repository, and a force-push (`before`
          # orphaned, never fetched) killed `git diff` with exit 128 so the
          # scan verified nothing while reporting red. The script prints what
          # it resolved to stderr, which the old inline version never did.
          BASE_REF="$(python -m app.scripts.guardrails_base \
            --before "$BASE_REF" \
            --head "$HEAD_REF" \
            --default-branch "${{ github.event.repository.default_branch }}")"

          python -m app.scripts.guardrails_scan --changed-from "$BASE_REF" --changed-to "$HEAD_REF"

      # The delta above is fast and attributable, but it only ever sees what
      # changed after it existed: a file that predates this workflow, or that
      # arrived in a squash-merge, is scanned once and then never again. The
      # broad coverage that used to exist was the empty-tree fallback -- a
      # defect -- so correcting it removed the only full scan there was. This
      # step restores it deliberately, on the default branch, where it costs
      # one run per merge instead of one per push.
      - name: Scan every tracked file
        if: >-
          github.event_name == 'push'
          && github.ref_name == github.event.repository.default_branch
        shell: bash
        run: |
          set -euo pipefail

          # The tracked-file listing lives in the script, not here: inline it
          # could not be tested, and `git ls-files | xargs` is exactly the kind
          # of untestable YAML that let two base-resolution defects ship.
          python -m app.scripts.guardrails_scan --all-tracked
