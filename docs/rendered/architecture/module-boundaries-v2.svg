<svg width="960" height="640" viewBox="0 0 960 640" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Module boundaries — LLM Chat Platform</title>
<desc>Package-level boundaries for chat, RAG generation, retrieval, feedback, providers, infrastructure and models. Dependencies point downward only; provider-specific coupling remains confined to adapters.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="960" height="640" fill="#FBFAF7"/>
<text x="480" y="36" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="600" fill="#26215C">Module boundaries</text>
<text x="480" y="56" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#5F5E5A">Dependencies point downward only. A module never imports from the layer above it, and no provider name appears above core/providers.</text>

<!-- http -->
<g><rect x="60" y="82" width="380" height="78" rx="12" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/>
<text x="80" y="106" font-family="sans-serif" font-size="13" font-weight="600" fill="#26215C">app/http</text>
<text x="80" y="124" font-family="sans-serif" font-size="10" fill="#3C3489">middleware — StagingGuard, CORS, Tenant, StructuredLogging,</text>
<text x="80" y="139" font-family="sans-serif" font-size="10" fill="#3C3489">RequestSizeLimit, RequestContext · request context helpers</text>
<text x="80" y="154" font-family="sans-serif" font-size="9" fill="#5F5E5A">Tenant identity is resolved here and nowhere else.</text></g>

<!-- api -->
<g><rect x="520" y="82" width="380" height="78" rx="12" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/>
<text x="540" y="106" font-family="sans-serif" font-size="13" font-weight="600" fill="#26215C">app/api</text>
<text x="540" y="124" font-family="sans-serif" font-size="10" fill="#3C3489">routes — chat, chat_feedback, retrieval, conversations,</text>
<text x="540" y="139" font-family="sans-serif" font-size="10" fill="#3C3489">usage_events, web/notion capabilities · schemas · deps</text>
<text x="540" y="154" font-family="sans-serif" font-size="9" fill="#5F5E5A">Routes hold no provider-specific logic.</text></g>

<line x1="440" y1="121" x2="518" y2="121" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="479" y="113" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#5F5E5A">wraps</text>

<line x1="620" y1="160" x2="620" y2="200" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="800" y1="160" x2="800" y2="392" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

<!-- domain -->
<g><rect x="380" y="200" width="420" height="112" rx="12" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/>
<text x="400" y="224" font-family="sans-serif" font-size="13" font-weight="600" fill="#04342C">app/core/domain</text>
<text x="400" y="241" font-family="sans-serif" font-size="10" fill="#085041">Provider-agnostic. Tenant scoping is enforced at this altitude.</text></g>
<g><rect x="398" y="252" width="180" height="46" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="488" y="271" text-anchor="middle" font-family="sans-serif" font-size="11.5" font-weight="500" fill="#2C2C2A">ChatService</text>
<text x="488" y="287" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#5F5E5A">RAG metadata · atomic write</text></g>
<g><rect x="592" y="252" width="90" height="46" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="637" y="271" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#2C2C2A">Provider</text>
<text x="637" y="286" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#2C2C2A">Factory</text></g>
<g><rect x="694" y="252" width="90" height="46" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/>
<text x="739" y="271" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="600" fill="#4A1B0C">Provider</text>
<text x="739" y="286" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="600" fill="#4A1B0C">Port</text></g>

<line x1="637" y1="312" x2="637" y2="392" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="650" y="356" font-family="sans-serif" font-size="9" fill="#5F5E5A">resolves</text>

<!-- providers -->
<g><rect x="500" y="392" width="330" height="86" rx="12" fill="#FAECE7" stroke="#993C1D" stroke-width="0.8"/>
<text x="520" y="416" font-family="sans-serif" font-size="13" font-weight="600" fill="#4A1B0C">app/core/providers</text>
<text x="520" y="433" font-family="sans-serif" font-size="10" fill="#712B13">LLM, embedding, vector-store and reranker adapters</text>
<text x="520" y="452" font-family="sans-serif" font-size="9.5" fill="#712B13">The only layer allowed to know a provider by name.</text>
<text x="520" y="468" font-family="sans-serif" font-size="9" fill="#8A5A3E">Every adapter implements ProviderPort.</text></g>
<path d="M760 392 L760 330 Q760 320 750 320 L739 320 L739 300" fill="none" stroke="#8A8880" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
<text x="772" y="360" font-family="sans-serif" font-size="9" fill="#8A8880">implements</text>

<!-- services -->
<g><rect x="60" y="200" width="280" height="278" rx="12" fill="#EAF3DE" stroke="#3B6D11" stroke-width="0.8"/>
<text x="80" y="224" font-family="sans-serif" font-size="13" font-weight="600" fill="#173404">app/services</text>
<text x="80" y="241" font-family="sans-serif" font-size="10" fill="#27500A">Application services around the domain.</text>
<text x="80" y="272" font-family="sans-serif" font-size="10" fill="#27500A">chat_response_cache · routing_signals</text>
<text x="80" y="292" font-family="sans-serif" font-size="10" fill="#27500A">conversation_query_service</text>
<text x="80" y="312" font-family="sans-serif" font-size="10" fill="#27500A">usage_events · usage_logger · trace</text>
<text x="80" y="332" font-family="sans-serif" font-size="10" fill="#27500A">readiness</text>
<text x="80" y="360" font-family="sans-serif" font-size="10" fill="#27500A">web_read · notion_read · notion_write</text>
<text x="80" y="378" font-family="sans-serif" font-size="9" fill="#5F5E5A">external capabilities, read-path only</text>
<text x="80" y="410" font-family="sans-serif" font-size="9" fill="#5F5E5A">Read endpoints filter by tenant here,</text>
<text x="80" y="424" font-family="sans-serif" font-size="9" fill="#5F5E5A">server-side (ADR-004).</text></g>
<line x1="340" y1="270" x2="396" y2="270" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

<line x1="200" y1="478" x2="200" y2="520" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="637" y1="478" x2="637" y2="520" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

<!-- infra + models -->
<g><rect x="60" y="520" width="400" height="80" rx="12" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.8"/>
<text x="80" y="544" font-family="sans-serif" font-size="13" font-weight="600" fill="#2C2C2A">app/infra</text>
<text x="80" y="562" font-family="sans-serif" font-size="10" fill="#5F5E5A">business + short-lived RLS session lifecycle · Redis client</text>
<text x="80" y="578" font-family="sans-serif" font-size="10" fill="#5F5E5A">infra schemas</text>
<text x="80" y="594" font-family="sans-serif" font-size="9" fill="#8A8880">Redis failures are absorbed, never surfaced to the write-path.</text></g>

<g><rect x="500" y="520" width="400" height="80" rx="12" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.8"/>
<text x="520" y="544" font-family="sans-serif" font-size="13" font-weight="600" fill="#2C2C2A">app/models · app/alembic</text>
<text x="520" y="562" font-family="sans-serif" font-size="10" fill="#5F5E5A">Conversation · Message · UsageEvent feedback · RAG corpus</text>
<text x="520" y="578" font-family="sans-serif" font-size="10" fill="#5F5E5A">deterministic migration chain</text>
<text x="520" y="594" font-family="sans-serif" font-size="9" fill="#8A8880">Migrations run explicitly, never at startup.</text></g>
<line x1="460" y1="560" x2="498" y2="560" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

<text x="480" y="628" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#8A8880">Authoritative detail: docs/lld_llm_chat_platform_live_doc.md · invariants in AGENTS.md.</text>
</svg>
