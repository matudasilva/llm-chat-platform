<svg width="960" height="700" viewBox="0 0 960 700" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Chat request flow (tenant-aware) — LLM Chat Platform</title>
<desc>End-to-end path of a /chat request: middleware and tenant resolution, optional pre-transaction RAG retrieval, ChatService orchestration through the provider chain, structured citations, persistence, feedback, and cache side effects.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="arrowdim" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#8A8880" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<rect width="960" height="700" fill="#FBFAF7"/>
<text x="480" y="36" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="600" fill="#26215C">Chat request flow (tenant-aware)</text>
<text x="480" y="56" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#5F5E5A">/chat is the only write-path. One transaction per request. Tenant identity is resolved once, at the edge, and travels in a ContextVar.</text>

<!-- Client -->
<g><rect x="40" y="82" width="200" height="56" rx="10" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.8"/>
<text x="140" y="106" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="500" fill="#2C2C2A">Client</text>
<text x="140" y="124" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#5F5E5A">X-Tenant-ID header → JWT → "default"</text></g>
<line x1="240" y1="110" x2="286" y2="110" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

<!-- Middleware stack -->
<g><rect x="286" y="82" width="634" height="146" rx="12" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/>
<text x="304" y="104" font-family="sans-serif" font-size="13" font-weight="600" fill="#26215C">Middleware stack — app/http/middleware/</text>
<text x="304" y="121" font-family="sans-serif" font-size="10" fill="#3C3489">Registration is LIFO: whatever is added last ends up outermost. Order below is outermost → innermost.</text></g>
<g><rect x="300" y="134" width="118" height="46" rx="7" fill="#FAECE7" stroke="#993C1D" stroke-width="0.8"/>
<text x="359" y="152" text-anchor="middle" font-family="sans-serif" font-size="10.5" font-weight="500" fill="#4A1B0C">StagingGuard</text>
<text x="359" y="168" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#712B13">pure ASGI</text></g>
<g><rect x="426" y="134" width="106" height="46" rx="7" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="479" y="152" text-anchor="middle" font-family="sans-serif" font-size="10.5" font-weight="500" fill="#2C2C2A">CORS</text>
<text x="479" y="168" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#5F5E5A">preflight stops here</text></g>
<g><rect x="540" y="134" width="122" height="46" rx="7" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.2"/>
<text x="601" y="152" text-anchor="middle" font-family="sans-serif" font-size="10.5" font-weight="600" fill="#04342C">TenantMiddleware</text>
<text x="601" y="168" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#085041">pure ASGI · survives SSE</text></g>
<g><rect x="670" y="134" width="112" height="46" rx="7" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="726" y="152" text-anchor="middle" font-family="sans-serif" font-size="10.5" font-weight="500" fill="#2C2C2A">StructuredLogging</text>
<text x="726" y="168" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#5F5E5A">JSON events</text></g>
<g><rect x="790" y="134" width="116" height="46" rx="7" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="848" y="152" text-anchor="middle" font-family="sans-serif" font-size="10.5" font-weight="500" fill="#2C2C2A">SizeLimit · Context</text>
<text x="848" y="168" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#5F5E5A">request_id</text></g>
<text x="603" y="204" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#3C3489">TenantMiddleware sets the tenant_id ContextVar and installs TenantContextFilter on the root log handler</text>
<text x="603" y="219" text-anchor="middle" font-family="sans-serif" font-size="9.5" fill="#5F5E5A">It is not outermost: CORS wraps it so rejected preflights never reach it, and StagingGuard wraps both.</text>

<line x1="601" y1="228" x2="601" y2="266" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

<!-- Route -->
<g><rect x="440" y="266" width="322" height="52" rx="10" fill="#EAF3DE" stroke="#3B6D11" stroke-width="1"/>
<text x="601" y="288" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="600" fill="#173404">POST /chat</text>
<text x="601" y="306" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#27500A">optional RAG resolves before persistence/SSE · sources returned structurally</text></g>
<line x1="601" y1="318" x2="601" y2="352" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

<!-- Chat service -->
<g><rect x="440" y="352" width="322" height="64" rx="10" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/>
<text x="601" y="376" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="600" fill="#26215C">ChatService</text>
<text x="601" y="393" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#3C3489">receives bounded context in ProviderInput.metadata</text>
<text x="601" y="408" text-anchor="middle" font-family="sans-serif" font-size="9.5" fill="#5F5E5A">provider-agnostic: no concrete provider is named here</text></g>

<!-- provider chain -->
<line x1="762" y1="384" x2="800" y2="384" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<g><rect x="800" y="352" width="120" height="64" rx="10" fill="#FAECE7" stroke="#993C1D" stroke-width="0.8"/>
<text x="860" y="374" text-anchor="middle" font-family="sans-serif" font-size="11.5" font-weight="500" fill="#4A1B0C">Routing layer</text>
<text x="860" y="390" text-anchor="middle" font-family="sans-serif" font-size="9.5" fill="#712B13">selects provider path</text>
<text x="860" y="406" text-anchor="middle" font-family="sans-serif" font-size="9.5" fill="#712B13">Provider Factory</text></g>
<line x1="860" y1="416" x2="860" y2="452" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<g><rect x="782" y="452" width="138" height="58" rx="10" fill="#FAECE7" stroke="#993C1D" stroke-width="0.8"/>
<text x="851" y="474" text-anchor="middle" font-family="sans-serif" font-size="11.5" font-weight="500" fill="#4A1B0C">ResilientProvider</text>
<text x="851" y="490" text-anchor="middle" font-family="sans-serif" font-size="9.5" fill="#712B13">single-hop fallback</text>
<text x="851" y="504" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#712B13">only before the first token</text></g>
<line x1="851" y1="510" x2="851" y2="546" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<g><rect x="782" y="546" width="138" height="46" rx="10" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="851" y="568" text-anchor="middle" font-family="sans-serif" font-size="11.5" font-weight="500" fill="#2C2C2A">LLM provider</text>
<text x="851" y="583" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#5F5E5A">behind ProviderPort</text></g>

<!-- persistence -->
<line x1="530" y1="416" x2="530" y2="470" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="516" y="444" text-anchor="end" font-family="sans-serif" font-size="9.5" fill="#5F5E5A">persist, one transaction</text>
<line x1="672" y1="416" x2="672" y2="470" stroke="#8A8880" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrowdim)"/>
<text x="686" y="444" font-family="sans-serif" font-size="9.5" fill="#8A8880">best-effort</text>

<g><rect x="410" y="470" width="240" height="86" rx="10" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.8"/>
<text x="530" y="494" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="600" fill="#2C2C2A">PostgreSQL</text>
<text x="530" y="512" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#5F5E5A">Conversation · Message (tenant_id)</text>
<text x="530" y="528" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#5F5E5A">UsageEvent · nullable up/down feedback</text>
<text x="530" y="546" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#8A8880">rolled back as a unit on failure</text></g>

<g><rect x="662" y="470" width="100" height="86" rx="10" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.8" stroke-dasharray="4 3"/>
<text x="712" y="494" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="600" fill="#2C2C2A">Redis</text>
<text x="712" y="512" text-anchor="middle" font-family="sans-serif" font-size="8.5" fill="#5F5E5A">chat:response:</text>
<text x="712" y="524" text-anchor="middle" font-family="sans-serif" font-size="8.5" fill="#5F5E5A">{tenant_id}:{sha256}</text>
<text x="712" y="544" text-anchor="middle" font-family="sans-serif" font-size="8.5" fill="#8A8880">non-stream only · bypassed for RAG</text></g>

<!-- logs -->
<line x1="601" y1="180" x2="180" y2="180" stroke="#8A8880" stroke-width="1.5" stroke-dasharray="4 3"/>
<line x1="180" y1="180" x2="180" y2="470" stroke="#8A8880" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrowdim)"/>
<g><rect x="90" y="470" width="180" height="70" rx="10" fill="#EAF3DE" stroke="#3B6D11" stroke-width="0.8"/>
<text x="180" y="494" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="500" fill="#173404">Structured logs</text>
<text x="180" y="512" text-anchor="middle" font-family="sans-serif" font-size="9.5" fill="#27500A">tenant_id on every record</text>
<text x="180" y="528" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#27500A">best-effort, never blocking</text></g>

<text x="480" y="628" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#5F5E5A">Solid arrows are the transactional path. Dashed arrows are best-effort: cache and telemetry failures never change write-path semantics.</text>
<text x="480" y="660" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#8A8880">Consolidates chat-flow v1/v2 and tenant-flow-v1. Middleware order verified against app/main.py. Authoritative detail: docs/lld_llm_chat_platform_live_doc.md · ADR-003.</text>
</svg>
