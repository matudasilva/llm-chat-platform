<svg width="1000" height="880" viewBox="0 0 1000 880" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Streaming and fallback sequence — LLM Chat Platform</title>
<desc>Sequence for POST /chat with stream=true after optional RAG retrieval has completed and its session has closed. It covers fallback before the first token, primary success, and terminal error after partial emission. Persistence remains one transaction after provider completion.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="arrowg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#0F6E56" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="arrowr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#993C1D" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<rect width="1000" height="880" fill="#FBFAF7"/>
<text x="500" y="34" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="600" fill="#26215C">Streaming and fallback sequence</text>
<text x="500" y="54" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#5F5E5A">POST /chat?stream=true — fallback is a decision taken before the first token, never after.</text>

<line x1="80" y1="112" x2="80" y2="740" stroke="#8A8880" stroke-width="1" stroke-dasharray="3 4"/>
<line x1="225" y1="112" x2="225" y2="740" stroke="#8A8880" stroke-width="1" stroke-dasharray="3 4"/>
<line x1="392" y1="112" x2="392" y2="740" stroke="#8A8880" stroke-width="1" stroke-dasharray="3 4"/>
<line x1="575" y1="112" x2="575" y2="740" stroke="#8A8880" stroke-width="1" stroke-dasharray="3 4"/>
<line x1="730" y1="112" x2="730" y2="740" stroke="#8A8880" stroke-width="1" stroke-dasharray="3 4"/>
<line x1="900" y1="112" x2="900" y2="740" stroke="#8A8880" stroke-width="1" stroke-dasharray="3 4"/>

<g><rect x="26" y="74" width="108" height="38" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.8"/><text x="80" y="98" text-anchor="middle" font-family="sans-serif" font-size="11.5" font-weight="500" fill="#2C2C2A">Client</text></g>
<g><rect x="171" y="74" width="108" height="38" rx="8" fill="#EAF3DE" stroke="#3B6D11" stroke-width="0.8"/><text x="225" y="98" text-anchor="middle" font-family="sans-serif" font-size="11.5" font-weight="500" fill="#173404">/chat</text></g>
<g><rect x="336" y="74" width="112" height="38" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/><text x="392" y="98" text-anchor="middle" font-family="sans-serif" font-size="11.5" font-weight="500" fill="#04342C">ChatService</text></g>
<g><rect x="521" y="74" width="108" height="38" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.8"/><text x="575" y="98" text-anchor="middle" font-family="sans-serif" font-size="11.5" font-weight="500" fill="#4A1B0C">Primary</text></g>
<g><rect x="676" y="74" width="108" height="38" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.8" stroke-dasharray="4 3"/><text x="730" y="98" text-anchor="middle" font-family="sans-serif" font-size="11.5" font-weight="500" fill="#4A1B0C">Fallback</text></g>
<g><rect x="846" y="74" width="108" height="38" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/><text x="900" y="98" text-anchor="middle" font-family="sans-serif" font-size="11.5" font-weight="500" fill="#26215C">PostgreSQL</text></g>

<line x1="80" y1="140" x2="223" y2="140" stroke="#5F5E5A" stroke-width="1.4" marker-end="url(#arrow)"/>
<text x="152" y="134" text-anchor="middle" font-family="sans-serif" font-size="9.5" fill="#2C2C2A">POST /chat?stream=true</text>
<line x1="225" y1="168" x2="390" y2="168" stroke="#5F5E5A" stroke-width="1.4" marker-end="url(#arrow)"/>
<text x="307" y="162" text-anchor="middle" font-family="sans-serif" font-size="9.5" fill="#2C2C2A">RAG resolved/closed · stream_chat(metadata)</text>
<line x1="392" y1="196" x2="573" y2="196" stroke="#5F5E5A" stroke-width="1.4" marker-end="url(#arrow)"/>
<text x="482" y="190" text-anchor="middle" font-family="sans-serif" font-size="9.5" fill="#2C2C2A">open stream</text>

<g><rect x="40" y="216" width="930" height="176" rx="8" fill="none" stroke="#0F6E56" stroke-width="1" stroke-dasharray="5 4"/>
<rect x="40" y="216" width="340" height="20" rx="4" fill="#E1F5EE"/>
<text x="52" y="231" font-family="sans-serif" font-size="10" font-weight="600" fill="#04342C">alt · primary cannot stream — no token emitted yet</text></g>
<line x1="392" y1="262" x2="728" y2="262" stroke="#0F6E56" stroke-width="1.4" marker-end="url(#arrowg)"/>
<text x="560" y="256" text-anchor="middle" font-family="sans-serif" font-size="9.5" fill="#04342C">fall back — allowed, nothing has been sent to the client</text>
<line x1="730" y1="288" x2="394" y2="288" stroke="#0F6E56" stroke-width="1.4" stroke-dasharray="5 3" marker-end="url(#arrowg)"/>
<text x="562" y="282" text-anchor="middle" font-family="sans-serif" font-size="9.5" fill="#085041">stream session</text>
<g><rect x="236" y="300" width="330" height="28" rx="6" fill="#EAF3DE" stroke="#3B6D11" stroke-width="0.6"/>
<text x="401" y="319" text-anchor="middle" font-family="sans-serif" font-size="9.5" fill="#173404">loop: event: token → SSE → client</text></g>
<line x1="392" y1="350" x2="898" y2="350" stroke="#5F5E5A" stroke-width="1.4" marker-end="url(#arrow)"/>
<text x="645" y="344" text-anchor="middle" font-family="sans-serif" font-size="9.5" fill="#2C2C2A">persist user message, assistant message and UsageEvent — one transaction</text>
<line x1="392" y1="378" x2="82" y2="378" stroke="#5F5E5A" stroke-width="1.4" stroke-dasharray="5 3" marker-end="url(#arrow)"/>
<text x="237" y="372" text-anchor="middle" font-family="sans-serif" font-size="9.5" fill="#2C2C2A">event: done (structured sources)</text>

<g><rect x="40" y="408" width="930" height="150" rx="8" fill="none" stroke="#3B6D11" stroke-width="1" stroke-dasharray="5 4"/>
<rect x="40" y="408" width="256" height="20" rx="4" fill="#EAF3DE"/>
<text x="52" y="423" font-family="sans-serif" font-size="10" font-weight="600" fill="#173404">else · primary streams successfully</text></g>
<line x1="575" y1="452" x2="394" y2="452" stroke="#5F5E5A" stroke-width="1.4" stroke-dasharray="5 3" marker-end="url(#arrow)"/>
<text x="484" y="446" text-anchor="middle" font-family="sans-serif" font-size="9.5" fill="#2C2C2A">stream session</text>
<g><rect x="236" y="466" width="330" height="28" rx="6" fill="#EAF3DE" stroke="#3B6D11" stroke-width="0.6"/>
<text x="401" y="485" text-anchor="middle" font-family="sans-serif" font-size="9.5" fill="#173404">loop: event: token → SSE → client</text></g>
<line x1="392" y1="516" x2="898" y2="516" stroke="#5F5E5A" stroke-width="1.4" marker-end="url(#arrow)"/>
<text x="645" y="510" text-anchor="middle" font-family="sans-serif" font-size="9.5" fill="#2C2C2A">persist messages and usage — one transaction, after the provider completes</text>
<line x1="392" y1="544" x2="82" y2="544" stroke="#5F5E5A" stroke-width="1.4" stroke-dasharray="5 3" marker-end="url(#arrow)"/>
<text x="237" y="538" text-anchor="middle" font-family="sans-serif" font-size="9.5" fill="#2C2C2A">event: done (structured sources)</text>

<g><rect x="40" y="574" width="930" height="140" rx="8" fill="none" stroke="#993C1D" stroke-width="1" stroke-dasharray="5 4"/>
<rect x="40" y="574" width="286" height="20" rx="4" fill="#FAECE7"/>
<text x="52" y="589" font-family="sans-serif" font-size="10" font-weight="600" fill="#4A1B0C">else · error after partial emission</text></g>
<g><rect x="236" y="606" width="330" height="26" rx="6" fill="#EAF3DE" stroke="#3B6D11" stroke-width="0.6"/>
<text x="401" y="624" text-anchor="middle" font-family="sans-serif" font-size="9.5" fill="#173404">some tokens already reached the client</text></g>
<line x1="575" y1="654" x2="394" y2="654" stroke="#993C1D" stroke-width="1.4" marker-end="url(#arrowr)"/>
<text x="484" y="648" text-anchor="middle" font-family="sans-serif" font-size="9.5" fill="#4A1B0C">streaming error</text>
<g><rect x="600" y="634" width="340" height="42" rx="6" fill="#FAECE7" stroke="#993C1D" stroke-width="0.8"/>
<text x="770" y="652" text-anchor="middle" font-family="sans-serif" font-size="9.5" font-weight="600" fill="#4A1B0C">No fallback here.</text>
<text x="770" y="667" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#712B13">Switching providers mid-stream would corrupt what was already sent.</text></g>
<line x1="392" y1="696" x2="82" y2="696" stroke="#993C1D" stroke-width="1.4" stroke-dasharray="5 3" marker-end="url(#arrowr)"/>
<text x="237" y="690" text-anchor="middle" font-family="sans-serif" font-size="9.5" fill="#4A1B0C">event: error</text>

<text x="500" y="776" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#5F5E5A">The SSE contract is exactly three event types: token, done, error.</text>
<text x="500" y="796" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#5F5E5A">Optional retrieval completes before streaming; persistence follows in one transaction after provider completion.</text>
<text x="500" y="840" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#8A8880">Authoritative detail: docs/lld_llm_chat_platform_live_doc.md · docs/error_decision_table.md · invariants in AGENTS.md.</text>
</svg>
