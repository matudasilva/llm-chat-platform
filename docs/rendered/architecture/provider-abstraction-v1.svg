<svg width="900" height="560" viewBox="0 0 900 560" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Provider abstraction — LLM Chat Platform</title>
<desc>How ChatService reaches an LLM without naming one. ORQ-25 bounded RAG sources travel through ProviderInput.metadata and one shared formatter materializes the same untrusted-evidence prompt for every adapter.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="arrowdim" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#8A8880" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<rect width="900" height="560" fill="#FBFAF7"/>
<text x="450" y="36" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="600" fill="#26215C">Provider abstraction</text>
<text x="450" y="56" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#5F5E5A">ChatService depends on the contract, never on an implementation. Swapping or adding a provider touches only the bottom row.</text>

<!-- ChatService -->
<g><rect x="60" y="92" width="200" height="62" rx="10" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/>
<text x="160" y="118" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="600" fill="#04342C">ChatService</text>
<text x="160" y="136" text-anchor="middle" font-family="sans-serif" font-size="9.5" fill="#085041">domain, provider-agnostic</text></g>

<!-- Factory -->
<line x1="260" y1="110" x2="336" y2="110" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="298" y="102" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#5F5E5A">uses</text>
<g><rect x="336" y="86" width="170" height="48" rx="10" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.8"/>
<text x="421" y="106" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="500" fill="#2C2C2A">Provider Factory</text>
<text x="421" y="122" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#5F5E5A">resolves from settings</text></g>

<!-- Port -->
<line x1="160" y1="154" x2="160" y2="212" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="172" y="188" font-family="sans-serif" font-size="9" fill="#5F5E5A">depends on contract</text>
<g><rect x="60" y="212" width="580" height="86" rx="12" fill="#FAECE7" stroke="#993C1D" stroke-width="1.2"/>
<text x="82" y="238" font-family="sans-serif" font-size="14" font-weight="600" fill="#4A1B0C">ProviderPort — the stable contract</text>
<text x="82" y="258" font-family="sans-serif" font-size="10.5" fill="#712B13">async generate(ProviderInput) → ProviderResult</text>
<text x="82" y="275" font-family="sans-serif" font-size="10.5" fill="#712B13">async stream(ProviderInput) → AsyncIterator[token]</text>
<text x="82" y="291" font-family="sans-serif" font-size="9" fill="#8A5A3E">Bounded RAG sources travel in metadata; a shared formatter adds one untrusted-evidence system message.</text></g>

<line x1="421" y1="134" x2="421" y2="210" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

<!-- Resilient -->
<line x1="642" y1="255" x2="698" y2="255" stroke="#8A8880" stroke-width="1.4" stroke-dasharray="4 3" marker-start="url(#arrowdim)"/>
<g><rect x="700" y="212" width="160" height="86" rx="12" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/>
<text x="780" y="238" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="600" fill="#26215C">ResilientProvider</text>
<text x="780" y="256" text-anchor="middle" font-family="sans-serif" font-size="9.5" fill="#3C3489">single-hop fallback</text>
<text x="780" y="271" text-anchor="middle" font-family="sans-serif" font-size="9.5" fill="#3C3489">no retry to the same provider</text>
<text x="780" y="288" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#5F5E5A">implements the port too</text></g>

<line x1="506" y1="110" x2="780" y2="110" stroke="#5F5E5A" stroke-width="1.5"/>
<line x1="780" y1="110" x2="780" y2="210" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="643" y="102" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#5F5E5A">resolves to</text>

<!-- adapters -->
<line x1="780" y1="298" x2="780" y2="336" stroke="#5F5E5A" stroke-width="1.5"/>
<line x1="150" y1="336" x2="780" y2="336" stroke="#5F5E5A" stroke-width="1.5"/>
<line x1="150" y1="336" x2="150" y2="378" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="400" y1="336" x2="400" y2="378" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="650" y1="336" x2="650" y2="378" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="465" y="328" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#5F5E5A">primary / fallback — chosen before the first token is emitted</text>

<g><rect x="60" y="378" width="180" height="72" rx="10" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.8"/>
<text x="150" y="404" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="500" fill="#2C2C2A">OpenAI provider</text>
<text x="150" y="422" text-anchor="middle" font-family="sans-serif" font-size="9.5" fill="#5F5E5A">httpx</text>
<text x="150" y="438" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#8A8880">implements ProviderPort</text></g>
<g><rect x="310" y="378" width="180" height="72" rx="10" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.8"/>
<text x="400" y="404" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="500" fill="#2C2C2A">Bedrock provider</text>
<text x="400" y="422" text-anchor="middle" font-family="sans-serif" font-size="9.5" fill="#5F5E5A">boto3</text>
<text x="400" y="438" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#8A8880">implements ProviderPort</text></g>
<g><rect x="560" y="378" width="180" height="72" rx="10" fill="#EAF3DE" stroke="#3B6D11" stroke-width="0.8"/>
<text x="650" y="404" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="500" fill="#173404">Stub provider</text>
<text x="650" y="422" text-anchor="middle" font-family="sans-serif" font-size="9.5" fill="#27500A">deterministic, no network</text>
<text x="650" y="438" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#27500A">what the test suite runs against</text></g>

<text x="450" y="492" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#5F5E5A">Metadata validation is shared; transport normalization stays adapter-local. No route or domain branch names a provider.</text>
<text x="450" y="524" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#8A8880">Authoritative detail: docs/lld_llm_chat_platform_live_doc.md · docs/error_decision_table.md.</text>
</svg>
