<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="850" viewBox="0 0 1400 850" role="img">
  <title>Document RAG lifecycle — LLM Chat Platform</title>
  <desc>Current document RAG lifecycle: offline ingestion discovers eligible repository documents, chunks and embeds them into a tenant-scoped PostgreSQL pgvector corpus. At runtime, optional chat augmentation retrieves and reranks chunks before provider generation, passes bounded untrusted evidence through provider metadata, and returns structured citations. Retrieval failure degrades to normal generation. Corpus, retrieval API, and chat augmentation flags are independent.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M1 1L8 5L1 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="1400" height="850" fill="#FBFAF7"/>
  <text x="700" y="38" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="600" fill="#26215C">Document RAG lifecycle</text>
  <text x="700" y="62" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#5F5E5A">The corpus is prepared offline; request-time retrieval is read-only and can optionally augment /chat.</text>

  <!-- Offline ingestion -->
  <rect x="36" y="92" width="1328" height="222" rx="16" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="1"/>
  <text x="60" y="122" font-family="sans-serif" font-size="15" font-weight="600" fill="#2C2C2A">1 · Offline corpus ingestion — CLI, not an HTTP write path</text>

  <g>
    <rect x="60" y="152" width="230" height="100" rx="12" fill="#EEEDFE" stroke="#534AB7"/>
    <text x="175" y="179" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="600" fill="#26215C">Repository sources</text>
    <text x="175" y="201" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#3C3489">eligible docs/*.md and app/*.py</text>
    <text x="175" y="222" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#5F5E5A">gitignored/private files excluded</text>
  </g>
  <line x1="290" y1="202" x2="335" y2="202" stroke="#5F5E5A" stroke-width="1.6" marker-end="url(#arrow)"/>
  <g>
    <rect x="335" y="152" width="215" height="100" rx="12" fill="#EEEDFE" stroke="#534AB7"/>
    <text x="442" y="179" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="600" fill="#26215C">Load and chunk</text>
    <text x="442" y="201" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#3C3489">normalize · fingerprint</text>
    <text x="442" y="222" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#5F5E5A">optional contextualization</text>
  </g>
  <line x1="550" y1="202" x2="595" y2="202" stroke="#5F5E5A" stroke-width="1.6" marker-end="url(#arrow)"/>
  <g>
    <rect x="595" y="152" width="230" height="100" rx="12" fill="#E1F5EE" stroke="#0F6E56"/>
    <text x="710" y="179" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="600" fill="#04342C">Embed chunks</text>
    <text x="710" y="201" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#085041">EmbeddingPort adapter</text>
    <text x="710" y="222" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#5F5E5A">shared embedding configuration</text>
  </g>
  <line x1="825" y1="202" x2="870" y2="202" stroke="#5F5E5A" stroke-width="1.6" marker-end="url(#arrow)"/>
  <g>
    <rect x="870" y="152" width="450" height="100" rx="12" fill="#E1F5EE" stroke="#0F6E56"/>
    <text x="1095" y="179" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="600" fill="#04342C">PostgreSQL + pgvector corpus</text>
    <text x="1095" y="201" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#085041">Document · Chunk · vector embedding · keyword search vector</text>
    <text x="1095" y="222" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#5F5E5A">tenant_id + corpus RLS · unprivileged rag_app access</text>
  </g>
  <text x="60" y="284" font-family="sans-serif" font-size="10.5" fill="#5F5E5A">Ingestion uses DATABASE_URL_APP and an explicit tenant ID. It is separate from POST /chat and POST /rag/retrieve.</text>

  <!-- Runtime retrieval -->
  <rect x="36" y="338" width="1328" height="380" rx="16" fill="#FBFAF7" stroke="#B4B2A9" stroke-width="1"/>
  <text x="60" y="369" font-family="sans-serif" font-size="15" font-weight="600" fill="#2C2C2A">2 · Request-time retrieval and generation</text>

  <g>
    <rect x="60" y="408" width="190" height="90" rx="12" fill="#EEEDFE" stroke="#534AB7"/>
    <text x="155" y="437" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="600" fill="#26215C">Tenant request</text>
    <text x="155" y="459" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#3C3489">POST /chat</text>
    <text x="155" y="480" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#5F5E5A">or POST /rag/retrieve</text>
  </g>
  <line x1="250" y1="453" x2="292" y2="453" stroke="#5F5E5A" stroke-width="1.6" marker-end="url(#arrow)"/>
  <g>
    <rect x="292" y="408" width="210" height="90" rx="12" fill="#EEEDFE" stroke="#534AB7"/>
    <text x="397" y="437" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="600" fill="#26215C">RAG dependency</text>
    <text x="397" y="459" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#3C3489">tenant-scoped short session</text>
    <text x="397" y="480" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#5F5E5A">retrieval finishes before chat write/SSE</text>
  </g>
  <line x1="502" y1="453" x2="544" y2="453" stroke="#5F5E5A" stroke-width="1.6" marker-end="url(#arrow)"/>
  <g>
    <rect x="544" y="408" width="290" height="118" rx="12" fill="#E1F5EE" stroke="#0F6E56"/>
    <text x="689" y="435" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="600" fill="#04342C">RetrievalPipeline</text>
    <text x="689" y="458" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#085041">query rewrite → embed → hybrid search</text>
    <text x="689" y="478" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#085041">semantic + keyword → RRF → rerank</text>
    <text x="689" y="503" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#5F5E5A">select and bound evidence; evaluate if needed</text>
  </g>
  <g>
    <rect x="900" y="408" width="230" height="118" rx="12" fill="#E1F5EE" stroke="#0F6E56"/>
    <text x="1015" y="435" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="600" fill="#04342C">Same PostgreSQL corpus</text>
    <text x="1015" y="458" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#085041">tenant RLS enforced</text>
    <text x="1015" y="478" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#085041">read-only search via rag_app</text>
    <text x="1015" y="503" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#5F5E5A">no corpus writes at request time</text>
  </g>
  <line x1="834" y1="443" x2="900" y2="443" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="865" y="435" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#5F5E5A">search</text>
  <line x1="900" y1="490" x2="834" y2="490" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="869" y="511" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#5F5E5A">ranked chunks</text>

  <path d="M689 526 V563 H1150 V588" fill="none" stroke="#5F5E5A" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="924" y="557" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#5F5E5A">bounded, normalized evidence in ProviderInput.metadata (untrusted content)</text>
  <g>
    <rect x="965" y="588" width="370" height="82" rx="12" fill="#F1EFE8" stroke="#5F5E5A"/>
    <text x="1150" y="616" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="600" fill="#2C2C2A">Provider-agnostic generation</text>
    <text x="1150" y="638" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#5F5E5A">shared formatter · answer · structured source citations</text>
    <text x="1150" y="656" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#5F5E5A">stream starts only after retrieval completes</text>
  </g>
  <g>
    <rect x="60" y="575" width="774" height="95" rx="12" fill="#FAECE7" stroke="#993C1D"/>
    <text x="84" y="602" font-family="sans-serif" font-size="12" font-weight="600" fill="#4A1B0C">Degradation and boundaries</text>
    <text x="84" y="624" font-family="sans-serif" font-size="10.5" fill="#712B13">Timeout, no results, or retrieval error → empty document context; normal generation continues.</text>
    <text x="84" y="645" font-family="sans-serif" font-size="10.5" fill="#712B13">Chat RAG bypasses the response cache; conversation history is a separate context channel.</text>
    <text x="84" y="662" font-family="sans-serif" font-size="9.5" fill="#5F5E5A">Chat returns source metadata only; POST /rag/retrieve is read-only and returns retrieved chunk text.</text>
  </g>

  <!-- Independent switches -->
  <rect x="36" y="742" width="1328" height="78" rx="14" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/>
  <text x="60" y="770" font-family="sans-serif" font-size="12" font-weight="600" fill="#26215C">Independent controls</text>
  <text x="60" y="795" font-family="sans-serif" font-size="10.5" fill="#3C3489">RAG_ENABLED: corpus readiness</text>
  <text x="450" y="795" font-family="sans-serif" font-size="10.5" fill="#3C3489">RETRIEVAL_PIPELINE_ENABLED: POST /rag/retrieve</text>
  <text x="930" y="795" font-family="sans-serif" font-size="10.5" fill="#3C3489">CHAT_RAG_AUGMENTATION_ENABLED: document context in POST /chat</text>
</svg>
